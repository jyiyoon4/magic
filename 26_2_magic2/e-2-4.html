<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>inline, block</title>
    <link rel="stylesheet" href="./style/style.css" />
  </head>
  <body>
    <h1>display: inline</h1>
    <span class="inline"> Inline1</span>
    <span class="inline"> Inline2</span>

    <h1>display: inline-block</h1>
    <span class="inline-block"> Inline-block1</span>
    <span class="inline-block"> Inline-block2</span>

    <h1>display: block</h1>
    <span class="block"> Block1</span>
    <span class="block"> Block2</span>
  </body>
</html>
